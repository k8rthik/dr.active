[project]
name = "dr-active"
version = "0.1.0"
description = "Predict protein-ligand binding affinity (pChEMBL) from a SMILES string and a target name: random forest on RDKit descriptors plus an experimental message-passing GNN."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rdkit>=2024.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "joblib>=1.3",
    "requests>=2.31",
    "torch>=2.2",
]

[project.scripts]
dr-active = "dractive.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dractive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: end-to-end tests that train small models on the real-data fixture",
]
